<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ARIA logo: an A with a sound wave as its crossbar">
  <defs>
    <linearGradient id="g-wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#0fa3a0"/>
      <stop offset="1" stop-color="#7c6bf0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g-wave)"/>
  <!-- The A's legs; a short sound wave (an "aria" is a melody) runs across as the crossbar. -->
  <path d="M17 50 L32 13 L47 50" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 37 q2.5 -5 5 0 t5 0 t5 0 t5 0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
