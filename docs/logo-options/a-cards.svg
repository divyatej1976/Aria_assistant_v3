<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ARIA logo: two study cards leaning together to form an A">
  <defs>
    <linearGradient id="g-cards" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#0fa3a0"/>
      <stop offset="1" stop-color="#7c6bf0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g-cards)"/>
  <!-- Two cards lean in at the top; the shorter bar between them is the A's crossbar. -->
  <rect x="18" y="13" width="11" height="40" rx="4" fill="#fff" transform="rotate(18 23.5 33)"/>
  <rect x="35" y="13" width="11" height="40" rx="4" fill="#fff" fill-opacity="0.82" transform="rotate(-18 40.5 33)"/>
  <rect x="23" y="36" width="18" height="5" rx="2.5" fill="#fff"/>
</svg>
