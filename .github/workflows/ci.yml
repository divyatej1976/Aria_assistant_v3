name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aria_test
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria -d aria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aria:aria@localhost:5432/aria_test
      - run: python scripts/migration_roundtrip.py
        env:
          DATABASE_URL: postgresql+psycopg://aria:aria@localhost:5432/aria_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run typecheck

