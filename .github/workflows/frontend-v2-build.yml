name: frontend-v2 build

on:
  push:
    paths: ["frontend-v2/**", "backend/**", "database/**", ".github/workflows/frontend-v2-build.yml"]
  pull_request:
    paths: ["frontend-v2/**", "backend/**", "database/**", ".github/workflows/frontend-v2-build.yml"]

defaults:
  run:
    working-directory: frontend-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # API contract drift check: the committed generated types must match the
      # backend's OpenAPI document exactly. Boot the isolated E2E backend,
      # regenerate, and fail when the file differs.
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
        working-directory: .
      - name: Regenerate API types against the backend
        env:
          PYTHONPATH: backend
          GROQ_API_KEY: ""
          ARIA_TTS_API_KEY: ""
          ARIA_STT_API_KEY: ""
          ARIA_EMBEDDING_API_KEY: ""
        run: |
          cd ..
          python frontend-v2/tests/create_test_db.py e2e-smoke-v2.db
          DATABASE_URL="sqlite:///./e2e-smoke-v2.db" \
          ARIA_SCHEDULER_ENABLED=false \
          ARIA_ENV=development \
          PYTHONPATH=backend nohup python -m uvicorn app.main:app --port 8010 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8010/health >/dev/null || (echo "backend failed to start" && exit 1)
      - run: npm run api:types
      - name: Fail on generated-types drift
        run: |
          git diff --exit-code -- lib/api-types.d.ts || (
            echo "::error::lib/api-types.d.ts is stale. Run: backend on :8010 + npm run api:types, then commit the regenerated file." && exit 1
          )
      - name: Production build (fonts are self-hosted; no network needed)
        run: npm run build
