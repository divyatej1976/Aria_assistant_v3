[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-backend"
version = "0.1.0"
description = "ARIA AI Learning Operating System backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.24,<2",
  "litellm>=1.60,<2",
  "reportlab>=4,<5",
  "pyttsx3>=2.9,<3",
  "apscheduler>=3.10,<4",
  "pywebpush>=1.14,<2",
  "prometheus-client>=0.20,<1",
  "sentry-sdk>=2.0,<3",
  "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
